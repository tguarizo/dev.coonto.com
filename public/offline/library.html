<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coonto · obras neste aparelho</title><style>body{margin:0;padding:28px;background:#031815;color:#f5ecd9;font:16px/1.5 system-ui}main{max-width:560px;margin:auto}a{color:#90d8ff}article{padding:20px;border:1px solid #315448;border-radius:18px;margin:16px 0}h1{font-family:Georgia,serif}</style><main><h1>Coonto neste aparelho</h1><p>Continue em uma experiência baixada. Reconecte-se para sincronizar suas notas e renovar o acesso.</p><div id="works">Conferindo as obras…</div><p><a href="/catalogo">Ver catálogo com internet</a></p></main><script>(async()=>{const owner=localStorage.getItem('coonto-offline-user'),cache=await caches.open('coonto-protected-v2'),works=[['o-alienista','O Alienista','/offline/reader.html'],['memorias-de-martha','Memórias de Martha','/offline/rc-reader.html?work=memorias-de-martha'],['divina-comedia-canto-i','Inferno, Canto I','/offline/rc-reader.html?work=divina-comedia-canto-i']],available=[];for(const [slug,title,href] of works){const file=await cache.match('/offline/'+slug+'.html');if(file&&file.headers.get('X-Coonto-User')===owner&&Date.parse(file.headers.get('X-Coonto-Expires')||'')>Date.now())available.push('<article><h2>'+title+'</h2><a href="'+href+'">Continuar experiência</a></article>');}document.getElementById('works').innerHTML=available.join('')||'<p>Nenhuma obra com acesso vigente foi baixada. Conecte-se e use “Baixar neste aparelho” dentro da leitura.</p>';})().catch(()=>document.getElementById('works').textContent='Conecte-se para preparar o uso neste aparelho.');</script></html>
