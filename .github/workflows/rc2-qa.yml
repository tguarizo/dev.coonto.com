name: RC2 browser validation
on:
  push:
    branches: [develop]
  workflow_dispatch:
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rc2-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test all interactions and responsive illustrations
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3102 > /tmp/coonto-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3102/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa/rc2-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc2-browser-evidence
          path: qa-results/
