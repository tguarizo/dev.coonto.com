name: Diagnose Coonto email delivery
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/check-email.yml', 'scripts/check-mail.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare existing deployment connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Request a real login code through the public app
        env:
          TEST_EMAIL: tguarizo@amriz.com.br
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          body=json.dumps({"channel":"email","email":os.environ["TEST_EMAIL"]}).encode()
          request=urllib.request.Request("https://dev.coonto.com/api/auth/request-code",data=body,headers={"Content-Type":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.loads(response.read().decode())
                  print(json.dumps({"http":response.status,"ok":bool(result.get("ok")),"mode":result.get("mode")}))
          except urllib.error.HTTPError as error:
              payload=error.read().decode(errors="replace")
              print(json.dumps({"http":error.code,"body":payload[:300]}))
              raise
          PY
      - name: Read sanitized email diagnostics
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Invalid deployment path'; exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          cat scripts/check-mail.cjs | ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node"
