name: RC2 audio credentials and budget
on:
  push:
    branches: [develop]
  workflow_dispatch:
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rc2-audio-check]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect audio budget without generating audio
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          scp scripts/close-rc2-audio.mjs ${SERVER_USER}@${SERVER_HOST}:/tmp/close-rc2-audio.mjs
          ssh ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' cp /tmp/close-rc2-audio.mjs app:/app/scripts/close-rc2-audio.mjs && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/close-rc2-audio.mjs --check-only"
