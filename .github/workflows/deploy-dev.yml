name: Deploy Coonto Dev to Ubuntu

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      education_qa:
        description: 'Carga fictícia educacional somente em dev (sem redefinir dados)'
        type: choice
        default: none
        options: [none, load]

concurrency:
  group: coonto-dev-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Verify beta routes and permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ensure audio validation tools
        run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: tests
    name: Deploy to dev.coonto.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        if: env.SSH_PRIVATE_KEY != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Package and Deploy
        if: env.SSH_PRIVATE_KEY != '' && !contains(github.event.head_commit.message, '[dante-audio-recovery]')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          mkdir -p /tmp/coonto-deployment-kit
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/coonto-deployment-kit/
          ARCHIVE="Coonto_Deployment_Kit_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.tar.gz"
          cd /tmp && tar -czf "$ARCHIVE" coonto-deployment-kit
          scp -o StrictHostKeyChecking=no "/tmp/$ARCHIVE" ${SERVER_USER}@${SERVER_HOST}:"/tmp/$ARCHIVE"
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "sudo mkdir -p ${DEPLOY_PATH} && sudo tar -xzf /tmp/$ARCHIVE -C ${DEPLOY_PATH} --strip-components=1 && rm /tmp/$ARCHIVE && cd ${DEPLOY_PATH} && sudo python3 scripts/configure-bootstrap.py && sudo bash ./coonto.sh install"

      - name: Load requested synthetic education data in dev
        if: env.SSH_PRIVATE_KEY != '' && (contains(github.event.head_commit.message, '[coonto-qa-load]') || inputs.education_qa == 'load')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Invalid deployment path'; exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/qa/education-fixtures.cjs --load && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/qa/education-fixtures.cjs --inspect"

      - name: Publish requested Martha editorial v2 in dev
        if: env.SSH_PRIVATE_KEY != '' && contains(github.event.head_commit.message, '[martha-v2]')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/publish-martha-dev.mjs --publish-dev"

      - name: Produce the full Martha v2 audio in dev
        if: env.SSH_PRIVATE_KEY != '' && contains(github.event.head_commit.message, '[martha-v2]')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/generate-beta-audio.mjs --work=memorias-de-martha && sudo docker compose -p '$PROJECT_NAME' exec -T -e COONTO_AUDIO_DAILY_CHAR_LIMIT=100000 app node scripts/generate-beta-audio.mjs --generate --work=memorias-de-martha"

      - name: Recover Dante audio without rebuilding or repeating provider calls
        if: env.SSH_PRIVATE_KEY != '' && contains(github.event.head_commit.message, '[dante-audio-recovery]')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          scp db/migrations/022_dante_interaction_audio.sql scripts/recover-dante-audio.mjs scripts/generate-beta-audio.mjs ${SERVER_USER}@${SERVER_HOST}:/tmp/
          ssh ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' cp /tmp/022_dante_interaction_audio.sql app:/app/scripts/022_dante_interaction_audio.sql && sudo docker compose -p '$PROJECT_NAME' cp /tmp/recover-dante-audio.mjs app:/app/scripts/recover-dante-audio.mjs && sudo docker compose -p '$PROJECT_NAME' cp /tmp/generate-beta-audio.mjs app:/app/scripts/generate-beta-audio.mjs && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/recover-dante-audio.mjs"

      - name: Publish the revised Dante in dev
        if: env.SSH_PRIVATE_KEY != '' && contains(github.event.head_commit.message, '[dante-rc1]')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/publish-dante-dev.mjs --publish-dev"

      - name: Produce full Dante audio for RC1
        if: env.SSH_PRIVATE_KEY != '' && contains(github.event.head_commit.message, '[dante-rc1]')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/generate-beta-audio.mjs --work=divina-comedia-canto-i && sudo docker compose -p '$PROJECT_NAME' exec -T -e COONTO_AUDIO_DAILY_CHAR_LIMIT=100000 app node scripts/generate-beta-audio.mjs --generate --work=divina-comedia-canto-i"

      - name: Generate versioned beta audio
        if: env.SSH_PRIVATE_KEY != '' && !contains(github.event.head_commit.message, '[martha-v2]') && !contains(github.event.head_commit.message, '[dante-rc1]')
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Invalid deployment path'; exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/generate-beta-audio.mjs --generate && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/prepare-beta-video.mjs"

      - name: Diagnose proxy when deployment fails
        if: failure() && env.SSH_PRIVATE_KEY != ''
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) exit 1;; esac
          ssh ${SERVER_USER}@${SERVER_HOST} "cd '$DEPLOY_PATH' && sudo python3 scripts/diagnose-proxy.py"

      - name: Notify configuration needed
        if: env.SSH_PRIVATE_KEY == ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "::warning ::SSH_PRIVATE_KEY secret não configurado no GitHub. O deploy automático será habilitado assim que os Secrets do repositório forem preenchidos."
