name: Complete O Alienista Audio
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coonto-alienista-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Generate remaining Alienista voices on the private server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Invalid deployment path'; exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/generate-beta-audio.mjs --generate --work=o-alienista"
      - name: Confirm 48 Alienista audio files
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && count=\$(sudo find audio/o-alienista -maxdepth 1 -type f -name '*.mp3' | wc -l); echo \"Alienista audio files: \$count\"; test \"\$count\" -ge 48"
