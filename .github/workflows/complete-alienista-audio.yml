name: Complete O Alienista Audio
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - audio/chapter2-generation
    paths:
      - scripts/generate-alienista-scene7-demo.mjs
      - scripts/generate-alienista-chapter2-audio.mjs
      - content/alienista-chapter2-voice-lines.json
      - scripts/list-elevenlabs-premade-voices.mjs
      - .github/workflows/complete-alienista-audio.yml
permissions:
  contents: read
concurrency:
  group: coonto-alienista-chapter2-audio-review
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Generate remaining Alienista voices on the private server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Invalid deployment path'; exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/generate-beta-audio.mjs --generate --work=o-alienista"
      - name: Confirm 48 Alienista audio files
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && count=\$(sudo find audio/o-alienista -maxdepth 1 -type f -name '*.mp3' | wc -l); echo \"Alienista audio files: \$count\"; test \"\$count\" -ge 48"
  scene7-demo:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Generate five consequence clips with the server ElevenLabs key
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Invalid deployment path'; exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          scp scripts/generate-alienista-scene7-demo.mjs "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/scripts/"
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/generate-alienista-scene7-demo.mjs"
          mkdir -p "$RUNNER_TEMP/scene7-audio/raw" "$RUNNER_TEMP/scene7-audio/normalized"
          scp "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/audio/o-alienista-scene7-demo/*.mp3" "$RUNNER_TEMP/scene7-audio/raw/"
      - name: Normalize clip loudness
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for source in "$RUNNER_TEMP"/scene7-audio/raw/*.mp3; do
            target="$RUNNER_TEMP/scene7-audio/normalized/$(basename "$source")"
            ffmpeg -hide_banner -loglevel error -y -i "$source" -af 'loudnorm=I=-16:TP=-2:LRA=5' -ar 44100 -ac 1 -codec:a libmp3lame -b:a 128k "$target"
          done
          test "$(find "$RUNNER_TEMP/scene7-audio/normalized" -maxdepth 1 -name 'consequence-*.mp3' | wc -l)" -eq 5
      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: coonto-alienista-scene7-audio
          path: ${{ runner.temp }}/scene7-audio/normalized/*.mp3
          if-no-files-found: error
          retention-days: 7
  chapter2-audio:
    if: github.event_name == 'push' && github.ref_name == 'audio/chapter2-generation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Copy approved script and lines to the private server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Invalid deployment path'; exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          scp scripts/generate-alienista-chapter2-audio.mjs "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/scripts/"
          scp content/alienista-chapter2-voice-lines.json "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/content/"
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' cp scripts/generate-alienista-chapter2-audio.mjs app:/app/scripts/ && sudo docker compose -p '$PROJECT_NAME' cp content/alienista-chapter2-voice-lines.json app:/app/content/"
      - name: Generate Chapter II clips through the server ElevenLabs key
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/generate-alienista-chapter2-audio.mjs --generate && mkdir -p audio/o-alienista-chapter2 && sudo docker compose -p '$PROJECT_NAME' cp app:/app/audio/o-alienista-chapter2/. audio/o-alienista-chapter2/ && tar -czf /tmp/coonto-alienista-chapter2-audio.tar.gz -C audio/o-alienista-chapter2 ."
          mkdir -p "$RUNNER_TEMP/chapter2-audio/raw" "$RUNNER_TEMP/chapter2-audio/normalized"
          scp "${SERVER_USER}@${SERVER_HOST}:/tmp/coonto-alienista-chapter2-audio.tar.gz" "$RUNNER_TEMP/chapter2-audio/"
          tar -xzf "$RUNNER_TEMP/chapter2-audio/coonto-alienista-chapter2-audio.tar.gz" -C "$RUNNER_TEMP/chapter2-audio/raw"
          find "$RUNNER_TEMP/chapter2-audio/raw" -type f -name '*.mp3' -print
          node -e "const clips=JSON.parse(require('fs').readFileSync('content/alienista-chapter2-voice-lines.json','utf8')); if(clips.length!==44) process.exit(1); for(const clip of clips) console.log(clip.id+'.mp3')" > "$RUNNER_TEMP/chapter2-audio/expected.txt"
          while IFS= read -r name; do
            test -n "$(find "$RUNNER_TEMP/chapter2-audio/raw" -type f -name "$name" -print -quit)"
          done < "$RUNNER_TEMP/chapter2-audio/expected.txt"
          echo "All 44 approved Chapter II clips recovered."
      - name: Prepare original clips for listening
        run: |
          while IFS= read -r name; do
            source="$(find "$RUNNER_TEMP/chapter2-audio/raw" -type f -name "$name" -print -quit)"
            cp "$source" "$RUNNER_TEMP/chapter2-audio/normalized/$name"
          done < "$RUNNER_TEMP/chapter2-audio/expected.txt"
          test "$(find "$RUNNER_TEMP/chapter2-audio/normalized" -type f -name '*.mp3' | wc -l)" -eq 44
      - name: Upload Chapter II audio for review
        uses: actions/upload-artifact@v4
        with:
          name: coonto-alienista-chapter2-audio
          path: ${{ runner.temp }}/chapter2-audio/normalized/*.mp3
          if-no-files-found: error
          retention-days: 14

  voice-catalog:
    if: github.event_name == 'push' && github.ref_name == 'audio/chapter2-generation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Read available premade voices through the private server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/dev' }}
        run: |
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9_./-]*) echo 'Invalid deployment path'; exit 1;; esac
          PROJECT_NAME="coonto-$(basename "$DEPLOY_PATH")"
          scp scripts/list-elevenlabs-premade-voices.mjs "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/scripts/"
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd '$DEPLOY_PATH' && sudo docker compose -p '$PROJECT_NAME' cp scripts/list-elevenlabs-premade-voices.mjs app:/app/scripts/ && sudo docker compose -p '$PROJECT_NAME' exec -T app node scripts/list-elevenlabs-premade-voices.mjs" > "$RUNNER_TEMP/voices.json"
          node -e "for(const v of JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))) console.log(v.name+' | '+v.voice_id+' | '+JSON.stringify(v.labels))" "$RUNNER_TEMP/voices.json"
      - name: Keep voice catalog for this private review
        uses: actions/upload-artifact@v4
        with:
          name: alienista-elevenlabs-premade-voices
          path: ${{ runner.temp }}/voices.json
          if-no-files-found: error
          retention-days: 3
